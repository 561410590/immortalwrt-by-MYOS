<%+cbi/valueheader%>
<div class="cellular-route" data-route-status="<%=luci.dispatcher.build_url('admin','modem','route_status')%>"
     data-route-set="<%=luci.dispatcher.build_url('admin','modem','route_set')%>"
     data-token="<%=luci.dispatcher.context.authtoken%>">
  <p class="cellular-route-state" role="status">正在读取线路策略…</p>
  <div class="cellular-actions">
    <button type="button" class="cbi-button" data-route="daily" disabled>日常 · 副 5G 优先</button>
    <button type="button" class="cbi-button cbi-button-apply" data-route="download" disabled>多连接下载分流</button>
    <button type="button" class="cbi-button" data-route="refresh">刷新状态</button>
  </div>
  <p class="cellular-help">只有内置 5G 在线时走内置；双线在线时，日常模式优先 port5 上行（副 5G 或普通有线 WAN）。副 5G 模式可将 IPv4 HTTP/HTTPS（含 QUIC）新连接分摊双路，单条连接使用一条线路。切换后现有连接保持原线路，IPv6 沿用原生选路。</p>
  <p class="cellular-help">使用普通 2.5G WAN 时先关闭 PoE，再到「网络 → 接口」把 cpe1 改为 DHCP、PPPoE 或静态地址，设备选择 port5；线路策略会跟随接口类型。</p>
</div>
<%+cbi/valuefooter%>
