<%+header%>
<%+zmode/cellular_assets%>
<section class="c5800-cellular">
  <h2>网络调试</h2><p class="cellular-help">通过网络调试服务发送模组命令。</p>
  <div class="cellular-panel">
    <p id="connectionState" class="cellular-inline-status" role="status">正在连接调试服务…</p>
    <div class="cellular-toolbar">
      <label class="cellular-command">命令<input type="text" id="commandInput" placeholder="输入命令"></label>
      <button type="button" id="commandSend" disabled onclick="sendCommand()">发送命令</button>
      <button type="button" onclick="document.getElementById('responseDisplay').textContent=''">清空结果</button>
    </div>
    <pre id="responseDisplay" style="min-height:280px" aria-label="调试返回结果"></pre>
  </div>
</section>
<script>
var ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.hostname+':5000');
var connectionState=document.getElementById('connectionState'), commandSend=document.getElementById('commandSend');
ws.onopen=function(){connectionState.textContent='调试服务已连接';commandSend.disabled=false;};
ws.onerror=function(){connectionState.textContent='连接失败，请检查调试服务';commandSend.disabled=true;};
ws.onclose=function(){connectionState.textContent='调试连接已关闭，刷新页面可重新连接';commandSend.disabled=true;};
ws.onmessage=function(event){document.getElementById('responseDisplay').textContent=event.data||'未收到返回内容';};
function sendCommand(){var input=document.getElementById('commandInput');if(ws.readyState===WebSocket.OPEN&&input.value.trim())ws.send(input.value);}
document.getElementById('commandInput').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();sendCommand();}});
</script>
<%+footer%>
