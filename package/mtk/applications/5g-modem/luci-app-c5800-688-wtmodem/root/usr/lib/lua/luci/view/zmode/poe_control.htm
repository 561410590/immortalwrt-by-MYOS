<%+cbi/valueheader%>
<div class="cellular-poe" data-poe-status="<%=luci.dispatcher.build_url('admin','modem','poe_status')%>"
     data-poe-set="<%=luci.dispatcher.build_url('admin','modem','poe_set')%>"
     data-token="<%=luci.dispatcher.context.authtoken%>">
  <p class="cellular-poe-state" role="status">正在读取供电状态…</p>
  <div class="cellular-actions">
    <button type="button" class="cbi-button cbi-button-apply" data-poe="1" disabled>开启供电</button>
    <button type="button" class="cbi-button" data-poe="0" disabled>关闭供电</button>
    <button type="button" class="cbi-button" data-poe="refresh">刷新状态</button>
  </div>
  <p class="cellular-help">同时保存副 5G 接口与 PoE 开关，重启保持选择。开启后副模组需完成启动、注册和拨号；手动关闭后保持关闭。</p>
  <a href="<%=luci.dispatcher.build_url('admin','modem','nets')%>">查看副模组连接状态 →</a>
</div>
<%+cbi/valuefooter%>
