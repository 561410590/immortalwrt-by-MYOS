<%+header%>
<%+zmode/cellular_assets%>
<section class="c5800-cellular">
  <h2>串口调试</h2>
  <p class="cellular-help">选择 AT 通道后发送命令，返回内容显示在下方。</p>
  <div class="cellular-panel">
    <div class="cellular-toolbar">
      <label>AT 通道<select id="drop1"><option value="1">通道 1</option><option value="2">通道 2</option></select></label>
      <label class="cellular-command">命令<input maxlength="100" type="text" id="atcmd" placeholder="例如 AT+CSQ"></label>
      <button type="button" id="sendat" onclick="sendcmd()">发送命令</button>
      <button type="button" onclick="document.getElementById('attxt').value=''">清空结果</button>
    </div>
    <p id="at-state" class="cellular-inline-status" role="status"></p>
    <textarea readonly id="attxt" rows="18" aria-label="命令返回结果"></textarea>
  </div>
</section>
<script src="<%=resource%>/xhr.js"></script>
<script>
function sendcmd() {
  var input=document.getElementById('atcmd'), button=document.getElementById('sendat');
  var state=document.getElementById('at-state'), output=document.getElementById('attxt');
  if (!input.value.trim() || button.disabled) return;
  button.disabled=true; state.textContent='正在执行…';
  XHR.get('<%=luci.dispatcher.build_url("admin","modem","send_atcmd")%>',
    {set:input.value,p:document.getElementById('drop1').value},function(xhr,data) {
      button.disabled=false;
      if (!data || typeof data.result!=='string') {state.textContent='执行失败，请检查通道或重试';return;}
      state.textContent='执行完成';
      output.value='> '+input.value+'\n'+data.result+'\n'+output.value;
    });
}
document.getElementById('atcmd').addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();sendcmd();}});
</script>
<%+footer%>
