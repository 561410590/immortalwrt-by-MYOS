# Mwrt 内存优化 (C 方案)
# 换页顺序靠 swap 优先级:先 zram(pri100),zram 满了才 SD swap(pri10)。
# swappiness 要 100 不要 10:10 时内核先挤程序代码/文件缓存,2026-10-14 B 板压测
# zram 才用了 15MB,文件缓存已从 162MB 掉到 29MB、系统卡住;100 时匿名页早早压进
# zram,过程平滑(zram 换页只花 CPU,不磨 SD)。
vm.swappiness=100
# 更积极回收目录项/inode 缓存,给应用腾出可用内存。
vm.vfs_cache_pressure=200
