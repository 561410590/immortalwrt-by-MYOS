<%+header%>
<%+zmode/cellular_assets%>
<section class="c5800-cellular">

    
    
    <h2>短信管理</h2>
    <p class="cellular-help">收取短信前，请在蜂窝设置中启用短信功能。</p>
    

    <div class="cellular-panel">
        <button class="button" onclick="sendcmd()">刷新短信</button>
        <button class="button-2" onclick="confirmDelete()">删除所有短信</button>
        <div class="cellular-table-scroll"><table id="messages">
            <thead>
                <tr>
                    <th>发件人</th>
                    <th>发件时间</th>
                    <th>内容</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table></div>
    </div>

    <script type="text/javascript">
        function sendcmd() {
            var s = 'at+cmgl=4'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "modem", "smscs")%>', { set: s, p: v }, function(x, rv) {
                var pd = rv.smsc;
                displayMessages(pd);
            });
        }

        function confirmDelete() {
            var userConfirmed2 = confirm("你确定要删除所有短信吗？此操作无法撤销。");
            if (userConfirmed2) {
                deleteallMessage()
            } 
        }

        function deleteMessage(index) {
            var command = 'AT+CMGD=' + index;
            var port = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "modem", "smscs")%>', { set: command, p: port }, function(x, rv) {
                sendcmd();
            });
        }

        function deleteallMessage() {
            var command = 'AT+CMGD=0,4'
            var port = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "modem", "smscs")%>', { set: command, p: port }, function(x, rv) {
                sendcmd();
                alert('用户已删除所有短信！');
            });
        }

        function displayMessages(smsData) {
            var messagesContainer = document.getElementById("messages").getElementsByTagName('tbody')[0];
            messagesContainer.innerHTML = ''; // 清空之前的短信
            var messages = smsData.split('------------------------------------------------------\n');
            messages.forEach(function(message, index) {
                if (message.trim() !== '') {
                    var lines = message.split('\n');
                    var sender = lines[2].split(':')[1];
                    var time = lines[3].split(':')[1];
                    var content = lines.slice(4).join('\n');
                    var row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${sender}</td>
                        <td>${time}</td>
                        <td>${content}</td>
                        <td><button class="delete-button" data-index="${index}">删除</button></td>
                    `;
                    messagesContainer.appendChild(row);
                }
            });

            var deleteButtons = document.querySelectorAll('.delete-button');
                deleteButtons.forEach(function(button) {
                    button.addEventListener('click', function() {
                        var index = this.getAttribute('data-index');
                        var userConfirmed = confirm('您确定要删除第 ' + index + ' 条短信吗？');
                        if (userConfirmed) {
                            deleteMessage(index);
                        } 
                    });
                });
        }

        window.onload = function() {
            sendcmd();
        };
    </script>

</section>
<%+footer%>
