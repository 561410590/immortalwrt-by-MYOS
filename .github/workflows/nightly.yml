name: MYOS daily firmware

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Firmware
        type: choice
        default: all
        options: [all, C8-688, C5800-688, NBCPE-688, C2000MAX, C2000-Ultra, N5000]

concurrency:
  group: myos-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      inputs_ref: ${{ steps.plan.outputs.inputs_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model || 'all' }}
        run: python3 .github/ci/plan.py

  build:
    name: Build ${{ matrix.branch }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/source/.ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPRESS: '1'
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Build dependencies and disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get update -qq
          sudo apt-get install -y build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget curl patch perl tar xz-utils zstd jq libfuse-dev libtool autoconf automake cmake ninja-build device-tree-compiler squashfs-tools
          df -h .
      - uses: actions/checkout@v4
        with:
          path: automation
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 561410590/MYOS-build-inputs
          ref: ${{ needs.prepare.outputs.inputs_ref }}
          ssh-key: ${{ secrets.MYOS_INPUTS_SSH_KEY }}
          path: private-inputs
          persist-credentials: false
      - name: Restore public downloads
        id: downloads
        uses: actions/cache/restore@v4
        with:
          path: source/dl
          key: dl-${{ matrix.branch }}-${{ matrix.sha }}-${{ github.run_id }}
          restore-keys: dl-${{ matrix.branch }}-
      - name: Restore compiler cache
        id: compiler
        uses: actions/cache/restore@v4
        with:
          path: source/.ccache
          key: compiler-v1-${{ matrix.branch }}-${{ hashFiles('source/.config', 'source/include/toolchain-build.mk', 'source/toolchain/**/Makefile') }}-${{ github.run_id }}
          restore-keys: compiler-v1-${{ matrix.branch }}-${{ hashFiles('source/.config', 'source/include/toolchain-build.mk', 'source/toolchain/**/Makefile') }}-
      - name: Compile and assemble
        env:
          BRANCH: ${{ matrix.branch }}
          MODELS: ${{ join(matrix.models, ',') }}
          SOURCE_COMMIT: ${{ matrix.sha }}
        run: python3 automation/.github/ci/build.py
      - name: Save downloads
        if: always() && steps.downloads.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: source/dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save compiler cache
        if: always() && steps.compiler.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: source/.ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}
      - name: Firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.branch }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 0
      - name: Build logs and permissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.branch }}
          path: logs/*
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: output
          merge-multiple: true
      - name: Update nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/publish.py
