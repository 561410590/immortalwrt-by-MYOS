<%+header%>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内置PWM风扇控制台</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #121212; 
            color: #ccc; 
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #461b39,#2a4455, #1d3318, #461010, #4b4b4b, #36360c, #100e2b, #311e1e, #0b3612, #12414d, #3a3849);
            background-size: 400% 400%;
            animation: gradientBG 100s ease infinite;
        }

        @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
        }

        h2, h4 {
            text-align: center;
            width: 150%;
        }

        h2 {
            margin-bottom: 10px;
            color: #ffffff; 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5); 
            background: #924864; 
            padding: 10px;
            border-radius: 10px;
        }

        h4 {
            margin-bottom: 20px;
            color: #ffffff; 
        }

        .button {
            background: #282c34;
            color: #ffffff;
            padding: 10px 20px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 150px;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.6); 
        }

        .button:hover {
            background: #4CAF50; 
            color: #000; 
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.8); 
        }

        .button:active {
            transform: translateY(1px);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #fan {
            display: block;
            margin: 20px auto;
            border: 10px solid #4CAF50; 
            border-radius: 38%; 
        }

        #speedDisplay, #temperatureDisplay {
            text-align: center;
            font-size: 1.2em;
            margin-top: 10px;
        }

        #energyBar {
            width: 80%;
            max-width: 300px;
            height: 20px;
            border: 2px solid #4CAF50; 
            border-radius: 5px;
            overflow: hidden;
            margin-top: 20px;
            background: #333;
        }

        #energyFill {
            height: 100%;
            background: linear-gradient(to right, #00BFA5, #1DE9B6); 
            transition: width 0.5s ease;
        }

        .switch-container {
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .switch-container.active {
            display: flex;
        }

        .switch-label {
            color: #fff;
            margin: 0 20px;
        }

        .switch {
            position: relative;
            width: 60px;
            height: 30px;
            background-color: #4CAF50;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .switch:before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background-color: #fff;
            border-radius: 50%;
            transition: left 0.3s ease;
        }

        .switch.active:before {
            left: 33px;
        }

        .switch.active {
            background-color: #00BFA5;
        }
        .slider-container {
            display: none;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            width: 80%;
        }

        .slider-container.active {
            display: flex;
        }

        #speedSlider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            background: linear-gradient(to right, #0000ff, #ff0000);
            outline: none;
            opacity: 0.9;
            transition: opacity .15s ease-in-out;
            cursor: pointer;
        }

        #speedSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        #speedSlider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>内置PWM风扇控制台</h2>
        <h4>温馨提示：请注意风扇处不要密封,会影响进出风向</h4>
        <div>
            <button class="button" onclick="fanstop()">静音模式</button>
            <button class="button" onclick="fanst1()">低速模式</button>
            <button class="button" onclick="fanst2()">常规模式</button>
            <button class="button" onclick="fanst3()">狂躁模式</button>
            <button class="button" onclick="fanst4()">智能模式</button>
            <button class="button" onclick="toggleSlider()">无极调速</button>
        </div>
        <div id="sliderContainer" class="slider-container">
            <input type="range" id="speedSlider" min="0" max="255" value="255" oninput="updateSpeed(this.value)">
        </div>
        <canvas id="fan" width="200" height="200"></canvas>
        <div id="speedDisplay">当前转速：0</div>
        <div id="temperatureDisplay">当前温度：0</div>
        <div id="energyBar">
            <div id="energyFill"></div>
        </div>

        <div id="switchContainer" class="switch-container">
            <span class="switch-label">使用模组温度</span>
            <div class="switch" id="temperatureSwitch" onclick="toggleSwitch()"></div>
            <span class="switch-label">使用CPU温度</span>
        </div>
    </div>

    <script type="text/javascript">
        let useModemTemp = false;
        let modemTempTimer = null;
        var tms
        var fanv
        let currentSpeed = 0;
        let currentTemperature = 0;
        const canvas = document.getElementById('fan');
        const ctx = canvas.getContext('2d');
        const energyFill = document.getElementById('energyFill');
        const switchContainer = document.getElementById('switchContainer');
        const temperatureSwitch = document.getElementById('temperatureSwitch');
        let wjtsvall = 255; 
        let timer; 
        let isSliderActive = false; 

        function handleClick(event) {
            const slider = event.target;
            const rect = slider.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            const newValue = Math.round(percentage * (slider.max - slider.min));
            slider.value = newValue;
            
            updateSpeed(newValue); // 更新速度
        }


        function toggleSlider() {
            var s = 'fanswj2'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanswj2")%>', { set: s, p: v }, function(x, rv) {
                fanwjvl = parseInt(rv.result, 10); // 确保值是整数
                const slider = document.getElementById('speedSlider');
                slider.value = fanwjvl; // 设置调速杆位置
                updateSpeed(fanwjvl); // 更新调速杆显示及风扇动画
                fanswj(fanwjvl);
            });
            const sliderContainer = document.getElementById('sliderContainer');
            sliderContainer.classList.add('active');
            isSliderActive = true;
            updateButtonStyles(999);
            switchContainer.classList.remove('active'); 
            const buttonElement = document.querySelector('button[onclick="toggleSlider()"]');
            buttonElement.style.background = '#1DE9B6'; 
            buttonElement.style.color = '#000';  
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }

        function resetSlider() {
            const sliderContainer = document.getElementById('sliderContainer');
            sliderContainer.classList.remove('active');
            const buttonElement = document.querySelector('button[onclick="toggleSlider()"]');
            buttonElement.style.background = '#282c34'; 
            buttonElement.style.color = '#fff';         
            if (!timer) {
                timer = setInterval(function() {
                    fanst();
                    fansttp();
                }, 8000); 
            }
        }

 
        function updateSpeed(value) {
            wjtsvall = value;
            updateFanAnimation(wjtsvall);
            fanswj(wjtsvall); 

            const red = Math.min(255, Math.floor((value / 255) * 255));
            const blue = 255 - red;
            const color = `rgb(${red}, 0, ${blue})`;
            
            document.getElementById('speedSlider').style.background = `linear-gradient(to right, ${color}, #ff0000)`;
            document.getElementById('speedDisplay').innerText = `当前转速：${wjtsvall}0-RPM`;
        }

        window.onload = function() {
            fanst(); 
            fansttp();
        };

        function updateFanAnimation(speed) {
            currentSpeed = speed;
            drawFan();
        }

        function drawFan() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const bladeLength = 70;
            const bladeWidth = 36;
            const bladeArc = Math.PI / 4;

            const colorValue = Math.floor((currentSpeed / 255) * 255);
            const color = `rgba(${colorValue}, 0, ${255 - colorValue}, 0.65)`;

            const minSpeed = 0.3;
            const maxSpeed = 4.0; 
            const speedFactor = minSpeed + ((currentSpeed / 255) * (maxSpeed - minSpeed));
            const angle = (performance.now() / 150) * speedFactor; 

            for (let i = 0; i < 5; i++) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + (i * (2 * Math.PI / 5)));
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(
                    bladeWidth * 0.3, -bladeLength * 0.40,
                    bladeWidth, -bladeLength * 0.7
                );
                ctx.arc(
                    0, 0, bladeLength,
                    -Math.PI / 2 + bladeArc / 2,
                    -Math.PI / 2 - bladeArc / 2,
                    true
                );
                ctx.quadraticCurveTo(
                    -bladeWidth * 0.3, -bladeLength * 0.40,
                    0, 0
                );
                ctx.closePath();

                ctx.fillStyle = color;
                ctx.shadowColor = "#fff";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();
            }
            // 中心
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
            ctx.fillStyle = "#e0e0e0";
            ctx.shadowBlur = 3;
            ctx.shadowColor = "#444";
            ctx.fill();
            ctx.restore();

            document.getElementById('speedDisplay').innerText = `当前转速：${currentSpeed}0-RPM`;
            requestAnimationFrame(drawFan);
        }

        function updateEnergyBar(temperature) {
            currentTemperature = temperature;
            const percentage = Math.min(Math.max(temperature / 100, 0), 1);
            energyFill.style.width = percentage * 100 + '%';
            
            const red = Math.min(255, Math.floor((temperature / 100) * 255));
            const green = 255 - red;
            const color = `rgb(${red}, ${green}, 0)`;
            energyFill.style.backgroundColor = color;

            if (useModemTemp) {
                let tempShow = modemName ? (modemName + "温度：" + temperature + "℃") : ("模组温度：" + temperature + "℃");
                document.getElementById('temperatureDisplay').innerText = tempShow;
                tms = "：" + temperature + "℃";
            } else {
                document.getElementById('temperatureDisplay').innerText = `${fanv}：${temperature}℃`;
                tms = `：${temperature}℃`;
            }
        }


        function fanstop() {
            var s = 'fanstop'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanstop")%>', { set: s, p: v }, function(x, rv) {
                updateFanAnimation(64);
            });
            resetSlider();
            updateButtonStyles(64);
            switchContainer.classList.remove('active'); 
            fansttp();
        }
        
        function fanst1() {
            var s = 'fanst1'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanst1")%>', { set: s, p: v }, function(x, rv) {
                updateFanAnimation(128);
            });
            resetSlider();
            updateButtonStyles(128);
            switchContainer.classList.remove('active');
            fansttp();
        }

        function fanst2() {
            var s = 'fanst2'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanst2")%>', { set: s, p: v }, function(x, rv) {
                updateFanAnimation(192);
            });
            resetSlider();
            updateButtonStyles(192);
            switchContainer.classList.remove('active'); 
            fansttp();
        }

        function fanst3() {
            var s = 'fanst3'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanst3")%>', { set: s, p: v }, function(x, rv) {
                updateFanAnimation(255);
            });
            resetSlider();
            updateButtonStyles(255);
            switchContainer.classList.remove('active'); 
            fansttp(); 
        }

        function fanst4() {
            var s = 'fanst4'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanst4")%>', { set: s, p: v }, function(x, rv) {
                var pd = rv.fanspd;
            });
            updateButtonStyles(0);
            switchContainer.classList.add('active'); 
            resetSlider();
        }

        function fanst() {
            var s = 'fanst'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanst")%>', { set: s, p: v }, function(x, rv) {
                var pd = parseInt(rv.fanspd, 10);
                var pd2 = rv.fancts;

                if (pd2 === "智能") {
                    updateButtonStyles(0);
                    switchContainer.classList.add('active'); 
                    
                } else if (pd2 === "手动") {
                    updateButtonStyles(pd);
                    switchContainer.classList.remove('active'); 
                } else if (pd2 === "无极") {
                    updateButtonStyles(999);
                    switchContainer.classList.remove('active'); 
                    toggleSlider()
                }

                updateFanAnimation(pd);
            });
        }
//---------------------------------------------------------------------------------------------------------------------------------------
        let modemName = "";  // 保存模组型号
        function fetchModemName() {
            var url = '<%=luci.dispatcher.build_url("admin", "modem", "qmodem", "get_modem_cfg")%>';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if(xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.cfgs && data.cfgs.length > 0) {
                            modemName = data.cfgs[0].name || "";
                        } else {
                            modemName = "";
                        }
                    } catch(e) {
                        modemName = "";
                    }
                }
            }
            xhr.send();
        }

        function renderNetInfo(data){
            if (!useModemTemp) return; // 只在需要时处理
            if (Array.isArray(data)) {
                let tempItem = data.find(item => item.key === "temperature");
                if (tempItem && tempItem.value) {
                    // 提取数值部分，例如 "44°C"
                    let match = tempItem.value.match(/(\d+)\s*°C/i);
                    let tempNum = match ? parseInt(match[1], 10) : 0;
                    updateEnergyBar(tempNum);
                }
            }
        }

        function pollNetInfo(){
            var ts = Date.now();
            var url = '<%=luci.dispatcher.build_url("admin", "fancontrol", "modem_ctrl")%>'
                + '?cfg=2_1&action=info&translate=1&' + ts;
            pollXHR = new window.XMLHttpRequest();
            pollXHR.open('GET', url, true);
            pollXHR.onreadystatechange = function(){
                if(pollXHR.readyState === 4 && pollXHR.status === 200){
                    var data;
                    try{ data = JSON.parse(pollXHR.responseText); }catch(e){}
                    renderNetInfo(data);
                }
            };
            pollXHR.send();
        }

        function startModemTempPoll() {
            stopModemTempPoll();
            pollNetInfo(); // 先立即请求一次
            modemTempTimer = setInterval(pollNetInfo, 5000); // 每5秒刷新
        }

        function stopModemTempPoll() {
            if (modemTempTimer) {
                clearInterval(modemTempTimer);
                modemTempTimer = null;
            }
        }

        function toggleSwitch() {
            if (temperatureSwitch.classList.contains('active')) {
                // 切换到模组温度
                XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fansvm")%>', { set: 's', p: 'v' }, function(x, rv) {
                    useModemTemp = true;
                    startModemTempPoll();
                    fanst();
                    fansttp();
                });
            } else {
                // 切换到CPU温度
                XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fansvc")%>', { set: 's', p: 'v' }, function(x, rv) {
                    useModemTemp = false;
                    stopModemTempPoll();
                    fanst();
                    fansttp();
                });
            }
            temperatureSwitch.classList.toggle('active');
        }

//---------------------------------------------------------------------------------------------------------------------------------------

        function updateButtonStyles(speed) {
            document.querySelectorAll('.button').forEach(button => {
                button.style.background = '#282c34'; 
                button.style.color = 'white';
                button.style.borderColor = '#4CAF50'; 
            });

            let buttonElement;
            switch (speed) {
                case 255:
                    buttonElement = document.querySelector('button[onclick="fanst3()"]');
                    break;
                case 192:
                    buttonElement = document.querySelector('button[onclick="fanst2()"]');
                    break;
                case 128:
                    buttonElement = document.querySelector('button[onclick="fanst1()"]');
                    break;
                case 64:
                    buttonElement = document.querySelector('button[onclick="fanstop()"]');
                    break;
                case 999:
                    buttonElement = document.querySelector('button[onclick="toggleSlider()"]');
                    break;
                default:
                    buttonElement = document.querySelector('button[onclick="fanst4()"]');
                    break;
            }

            if (buttonElement) {
                buttonElement.style.background = '#1DE9B6'; 
                buttonElement.style.color = '#000'; 
            }
        }

        function fansttp() {
            var s = 'fanst'; 
            var v = '1'; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fansttp")%>', { set: s, p: v }, function(x, rv) {
                var pd = rv.fansttp;
                fanv = rv.fansv;
                if (fanv === "模组温度") {
                    temperatureSwitch.classList.remove('active');
                    useModemTemp = true;
                    fetchModemName(); 
                    startModemTempPoll();
                } else {
                    temperatureSwitch.classList.add('active');
                    useModemTemp = false;
                    stopModemTempPoll();
                    updateEnergyBar(pd); // 只用CPU温度
                }
            });
        }


        function fanswj(value) {
        var s = 'fanswj'; 
        var v = value; 
            XHR.get('<%=luci.dispatcher.build_url("admin", "fancontrol", "fanswj")%>', { set: s, p: v }, function(x, rv) {
                
            });
        }
    </script>
</body>
<%+footer%>
