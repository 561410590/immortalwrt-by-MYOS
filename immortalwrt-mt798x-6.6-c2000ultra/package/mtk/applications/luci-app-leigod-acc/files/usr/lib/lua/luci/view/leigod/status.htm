<fieldset class="cbi-section">
	<legend><%:Running Status%></legend>
	<table class="table" id="leigod_status">
		<tr class="tr"><td class="td left" width="33%"><%:Service%></td><td class="td left" id="lg_service">-</td></tr>
		<tr class="tr"><td class="td left"><%:APP Discovery%></td><td class="td left" id="lg_discover">-</td></tr>
		<tr class="tr"><td class="td left"><%:APP Binding%></td><td class="td left" id="lg_bound">-</td></tr>
		<tr class="tr"><td class="td left"><%:Accelerating%></td><td class="td left" id="lg_acc">-</td></tr>
		<tr class="tr"><td class="td left"><%:Engine%></td><td class="td left" id="lg_engine">-</td></tr>
	</table>
	<!-- 不用 cbi-page-actions: 那是 CBI 页尾「保存并应用」的容器, 同名会被主题/脚本当成页尾按钮区 -->
	<div id="lg_actions" style="text-align:left;margin-top:1em">
		<input type="button" class="btn cbi-button cbi-button-apply" id="lg_btn_start" value="<%:Start%>" onclick="return lg_control('start')" />
		<input type="button" class="btn cbi-button cbi-button-reload" id="lg_btn_restart" value="<%:Restart%>" onclick="return lg_control('restart')" />
		<input type="button" class="btn cbi-button cbi-button-reset" id="lg_btn_stop" value="<%:Stop%>" onclick="return lg_control('stop')" />
		<span id="lg_msg"></span>
	</div>
</fieldset>

<script type="text/javascript">//<![CDATA[
(function() {
	var T = {
		running: '<%:Running%>', stopped: '<%:Not running%>',
		autostart: '<%:Start on boot%>', noautostart: '<%:Not started on boot%>',
		ready: '<%:Ready, open the Leigod APP on the same LAN to add this router%>',
		notready: '<%:Discovery service is not up%>',
		bound: '<%:Bound%>', unbound: '<%:Not bound%>', devices: '<%:Devices%>',
		none: '<%:None%>', mode: '<%:Mode%>', version: '<%:Version%>',
		busy: '<%:Applying, please wait...%>'
	};
	var types = { Phone: '<%:Phone%>', PC: '<%:PC%>', Game: '<%:Console%>', Unknown: '<%:Unknown%>' };

	function set(id, text, ok) {
		var el = document.getElementById(id);
		if (!el) return;
		el.textContent = text;
		el.style.color = (ok === undefined) ? '' : (ok ? 'green' : 'red');
	}

	function render(st) {
		if (!st) return;
		var up = st.daemon && st.web;
		set('lg_service', (up ? T.running : T.stopped) + ' / ' + (st.enabled ? T.autostart : T.noautostart), up);
		set('lg_discover', (st.port_api && st.port_discover) ? T.ready : T.notready, !!(st.port_api && st.port_discover));
		set('lg_bound', (st.bound ? T.bound : T.unbound) + ' (' + T.devices + ': ' + st.devices + ')', !!st.bound);
		// luci.jsonc 把空 table 编成 {}, 不是 []
		var acc = (Array.isArray(st.accelerating) ? st.accelerating : []).map(function(t) { return types[t] || t; });
		set('lg_acc', acc.length ? acc.join(', ') : T.none);
		set('lg_engine', T.version + ' ' + (st.version || '-') + ', ' + T.mode + ' ' + (st.mode || '-') + ' / ' + (st.backend || '-'));
		document.getElementById('lg_btn_start').style.display = up ? 'none' : '';
		document.getElementById('lg_btn_restart').style.display = up ? '' : 'none';
		document.getElementById('lg_btn_stop').style.display = (up || st.enabled) ? '' : 'none';
	}

	var statusUrl = '<%=url("admin/services/acc/status")%>';

	window.lg_control = function(op) {
		var btns = document.querySelectorAll('#lg_actions input');
		for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
		set('lg_msg', T.busy);
		XHR.post('<%=url("admin/services/acc/control")%>', { token: '<%=token%>', op: op }, function() {
			// 引擎起来后 daemon 再拉起 web 子进程, 稍等再刷
			setTimeout(function() {
				XHR.get(statusUrl, null, function(x, st) {
					render(st);
					set('lg_msg', '');
					for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
				});
			}, 3000);
		});
		return false;
	};

	XHR.poll(5, statusUrl, null, function(x, st) { render(st); });
})();
//]]></script>
